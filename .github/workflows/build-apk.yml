name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p _proj
          unzip -q -o "$ZIP" -d _proj
          # find the folder that holds settings.gradle (works with or without a top folder)
          ROOT=$(dirname "$(find _proj -name settings.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/release/app-release.apk" TalhaLight.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalhaLight-apk
          path: TalhaLight.apk
